<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store POS</title>
    <base href="/" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <link href="css/app.css" rel="stylesheet" />
    <link href="StorePOS.styles.css" rel="stylesheet" />
    <script>
        (function () {
            window.storePosConfirm = function (message) {
                return true;
            };
            window.storePosPrint = function () {
                window.print();
            };
            window.storeCopyText = function (text) {
                try {
                    if (navigator.clipboard && navigator.clipboard.writeText)
                        return navigator.clipboard.writeText(text);
                    var ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    return Promise.resolve();
                } catch (e) {
                    console.error(e);
                    return Promise.reject(e);
                }
            };
            window.storeDownloadFile = function (filename, base64, mime) {
                try {
                    var bin = atob(base64);
                    var bytes = new Uint8Array(bin.length);
                    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                    var blob = new Blob([bytes], { type: mime || 'application/octet-stream' });
                    var url = URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    a.click();
                    URL.revokeObjectURL(url);
                    return true;
                } catch (e) {
                    console.error(e);
                    return false;
                }
            };
            // USB keyboard-wedge: buffer keys, on Enter push into the barcode input and notify Blazor.
            window.initStorePosPosHotkeys = function (dotNetRef) {
                if (window.__posHotkeyCleanup) window.__posHotkeyCleanup();
                var fn = function (e) {
                    var k = e.key;
                    if (k === 'F2') {
                        e.preventDefault();
                        dotNetRef.invokeMethodAsync('PosHotkeyFocusBarcode');
                    } else if (k === 'F12') {
                        e.preventDefault();
                        dotNetRef.invokeMethodAsync('PosHotkeyCheckout');
                    } else if (k === 'Escape') {
                        e.preventDefault();
                        dotNetRef.invokeMethodAsync('PosHotkeyClearCart');
                    } else if (k === 'F5') {
                        e.preventDefault();
                        dotNetRef.invokeMethodAsync('PosHotkeyRefreshStock');
                    }
                };
                document.addEventListener('keydown', fn, true);
                window.__posHotkeyCleanup = function () {
                    document.removeEventListener('keydown', fn, true);
                    window.__posHotkeyCleanup = null;
                };
            };
            window.disposeStorePosPosHotkeys = function () {
                if (window.__posHotkeyCleanup) window.__posHotkeyCleanup();
            };
            window.initStorePosBarcodeWedge = function (dotNetRef, inputSelector) {
                window.__posWedgeDotNet = dotNetRef;
                window.__posWedgeSelector = inputSelector;
                if (window.__posWedgeListenerAttached) return;
                window.__posWedgeListenerAttached = true;
                var buffer = '';
                document.addEventListener('keydown', function (ev) {
                    var ref = window.__posWedgeDotNet;
                    var sel = window.__posWedgeSelector;
                    if (!ref || !sel) return;
                    var t = ev.target;
                    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable))
                        return;
                    if (ev.key === 'Enter') {
                        if (buffer.length > 0) {
                            var el = document.querySelector(sel);
                            if (el) {
                                el.value = buffer;
                                el.dispatchEvent(new Event('input', { bubbles: true }));
                                el.dispatchEvent(new Event('change', { bubbles: true }));
                            }
                            ref.invokeMethodAsync('OnWedgeBarcode', buffer);
                            buffer = '';
                            ev.preventDefault();
                        }
                        return;
                    }
                    if (ev.key.length === 1 && !ev.ctrlKey && !ev.metaKey && !ev.altKey)
                        buffer += ev.key;
                }, true);
            };
        })();
    </script>
</head>

<body class="bg-slate-950 text-slate-100 antialiased">
    <div id="app">Loading…</div>
    <script src="js/barcodePrint.js"></script>
    <script src="_framework/blazor.webview.js"></script>
</body>

</html>
