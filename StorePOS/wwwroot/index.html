<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store POS</title>
    <base href="/" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <link href="css/app.css" rel="stylesheet" />
    <link href="StorePOS.styles.css" rel="stylesheet" />
    <script>
        (function () {
            window.storePosConfirm = function (message) {
                return true;
            };
            window.storePosPrint = function () {
                window.print();
            };
            window.storeCopyText = function (text) {
                try {
                    if (navigator.clipboard && navigator.clipboard.writeText)
                        return navigator.clipboard.writeText(text);
                    var ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    return Promise.resolve();
                } catch (e) {
                    console.error(e);
                    return Promise.reject(e);
                }
            };
            window.storeDownloadFile = function (filename, base64, mime) {
                try {
                    var bin = atob(base64);
                    var bytes = new Uint8Array(bin.length);
                    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                    var blob = new Blob([bytes], { type: mime || 'application/octet-stream' });
                    var url = URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    a.click();
                    URL.revokeObjectURL(url);
                    return true;
                } catch (e) {
                    console.error(e);
                    return false;
                }
            };
            // USB keyboard-wedge: buffer keys, on Enter push into the barcode input and notify Blazor.
            window.initStorePosPosHotkeys = function (dotNetRef) {
                if (window.__posHotkeyCleanup) window.__posHotkeyCleanup();
                var fn = function (e) {
                    var k = e.key;
                    if (k === 'F2') {
                        e.preventDefault();
                        dotNetRef.invokeMethodAsync('PosHotkeyFocusBarcode');
                    } else if (k === 'F12') {
                        e.preventDefault();
                        dotNetRef.invokeMethodAsync('PosHotkeyCheckout');
                    } else if (k === 'Escape') {
                        e.preventDefault();
                        dotNetRef.invokeMethodAsync('PosHotkeyClearCart');
                    } else if (k === 'F5') {
                        e.preventDefault();
                        dotNetRef.invokeMethodAsync('PosHotkeyRefreshStock');
                    }
                };
                document.addEventListener('keydown', fn, true);
                window.__posHotkeyCleanup = function () {
                    document.removeEventListener('keydown', fn, true);
                    window.__posHotkeyCleanup = null;
                };
            };
            window.disposeStorePosPosHotkeys = function () {
                if (window.__posHotkeyCleanup) window.__posHotkeyCleanup();
            };
            window.initStorePosBarcodeWedge = function (dotNetRef, inputSelector) {
                window.__posWedgeDotNet = dotNetRef;
                window.__posWedgeSelector = inputSelector;
                if (window.__posWedgeListenerAttached) return;
                window.__posWedgeListenerAttached = true;
                var buffer = '';
                document.addEventListener('keydown', function (ev) {
                    var ref = window.__posWedgeDotNet;
                    var sel = window.__posWedgeSelector;
                    if (!ref || !sel) return;
                    var t = ev.target;
                    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable))
                        return;
                    if (ev.key === 'Enter') {
                        if (buffer.length > 0) {
                            var el = document.querySelector(sel);
                            if (el) {
                                el.value = buffer;
                                el.dispatchEvent(new Event('input', { bubbles: true }));
                                el.dispatchEvent(new Event('change', { bubbles: true }));
                            }
                            ref.invokeMethodAsync('OnWedgeBarcode', buffer);
                            buffer = '';
                            ev.preventDefault();
                        }
                        return;
                    }
                    if (ev.key.length === 1 && !ev.ctrlKey && !ev.metaKey && !ev.altKey)
                        buffer += ev.key;
                }, true);
            };

            // Barcode labels: print from the main WebView document (same approach as storePosPrint / receipts).
            (function () {
                var DEFAULT_WIDTH_MM = 35;
                var DEFAULT_HEIGHT_MM = 25;

                function readLabelSize(options) {
                    var widthMm = DEFAULT_WIDTH_MM;
                    var heightMm = DEFAULT_HEIGHT_MM;
                    try {
                        if (options && options.widthMm) widthMm = options.widthMm;
                        else {
                            var storedW = parseInt(localStorage.getItem('kaif_label_width_mm') || '', 10);
                            if (storedW) widthMm = storedW;
                        }
                        if (options && options.heightMm) heightMm = options.heightMm;
                        else {
                            var storedH = parseInt(localStorage.getItem('kaif_label_height_mm') || '', 10);
                            if (storedH) heightMm = storedH;
                        }
                    } catch (e) { }
                    widthMm = Math.max(20, Math.min(108, widthMm));
                    heightMm = Math.max(15, Math.min(150, heightMm));
                    return { widthMm: widthMm, heightMm: heightMm };
                }

                function ensureBarcodePrintArea() {
                    var root = document.getElementById('barcode-print-area');
                    if (!root) {
                        root = document.createElement('div');
                        root.id = 'barcode-print-area';
                        root.setAttribute('aria-hidden', 'true');
                        document.body.appendChild(root);
                    }
                    return root;
                }

                function setBarcodePageSize(widthMm, heightMm) {
                    var id = 'store-barcode-page-size';
                    var el = document.getElementById(id);
                    if (!el) {
                        el = document.createElement('style');
                        el.id = id;
                        document.head.appendChild(el);
                    }
                    el.textContent = '@page { size: ' + widthMm + 'mm ' + heightMm + 'mm; margin: 0; }';
                }

                function cleanupBarcodePrint() {
                    var root = document.getElementById('barcode-print-area');
                    if (root) root.innerHTML = '';
                }

                function renderBarcodePrint(dataUrl, count, options) {
                    var copies = Math.max(1, Math.min(500, parseInt(count, 10) || 1));
                    var size = readLabelSize(options);
                    setBarcodePageSize(size.widthMm, size.heightMm);
                    var root = ensureBarcodePrintArea();
                    root.style.setProperty('--barcode-label-w', size.widthMm + 'mm');
                    root.style.setProperty('--barcode-label-h', size.heightMm + 'mm');
                    var html = '';
                    for (var i = 0; i < copies; i++) {
                        html += '<div class="barcode-label-page"><img src="' + dataUrl + '" alt="Barcode label" /></div>';
                    }
                    root.innerHTML = html;
                    var imgs = root.querySelectorAll('img');
                    if (!imgs.length) return false;
                    var loaded = 0;
                    var printed = false;
                    var tryPrint = function () {
                        loaded++;
                        if (loaded >= imgs.length && !printed) {
                            printed = true;
                            window.print();
                        }
                    };
                    for (var j = 0; j < imgs.length; j++) {
                        if (imgs[j].complete) tryPrint();
                        else {
                            imgs[j].onload = tryPrint;
                            imgs[j].onerror = tryPrint;
                        }
                    }
                    return true;
                }

                window.storePrintBarcodeLabelSize = function (widthMm, heightMm) {
                    try {
                        localStorage.setItem('kaif_label_width_mm', String(Math.max(20, Math.min(108, widthMm))));
                        localStorage.setItem('kaif_label_height_mm', String(Math.max(15, Math.min(150, heightMm))));
                    } catch (e) { }
                };

                window.storePrintBarcodeCancel = function () {
                    cleanupBarcodePrint();
                    return true;
                };

                window.storePrintBarcodeBegin = function () {
                    return true;
                };

                window.storePrintBarcodeFinishPending = function (dataUrl, count, options) {
                    return renderBarcodePrint(dataUrl, count, options);
                };

                window.storePrintBarcode = function (dataUrl, count, options) {
                    return renderBarcodePrint(dataUrl, count, options);
                };

                window.addEventListener('afterprint', cleanupBarcodePrint);
            })();
        })();
    </script>
</head>

<body class="bg-slate-950 text-slate-100 antialiased">
    <div id="app">Loading…</div>
    <script src="_framework/blazor.webview.js"></script>
</body>

</html>
