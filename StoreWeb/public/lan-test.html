<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Kaif Store — LAN test</title>
    <style>
      body {
        font: 16px/1.5 system-ui, sans-serif;
        max-width: 28rem;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #222;
      }
      .ok {
        color: #0a7;
        font-weight: 600;
      }
      code {
        background: #f4f4f4;
        padding: 0.1em 0.35em;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>LAN connection OK</h1>
    <p class="ok">Your phone can reach the store server.</p>
    <p>Open the dashboard: <a id="dash" href="/">home page</a></p>
    <p id="api" class="muted">Checking API…</p>
    <script>
      document.getElementById('dash').href = location.origin + '/';
      fetch('/api/health')
        .then(function (r) {
          return r.ok ? r.json() : Promise.reject(r.status);
        })
        .then(function (h) {
          document.getElementById('api').textContent =
            'API OK — version ' + (h.labelRenderVersion || h.status);
        })
        .catch(function () {
          document.getElementById('api').textContent = 'API check failed — reload or contact admin.';
        });
    </script>
  </body>
</html>
